[project]
name = "sugarloaf"
version = "0.1.0"
description = "Platform-neutral graphs for quantitative trading research"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.scripts]
sugarloaf = "sugarloaf.cli:main"

[dependency-groups]
dev = ["pytest>=7", "ruff>=0.9"]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-mermaid2-plugin>=1.2,<2",
    "mkdocstrings[python]>=0.30,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".uv-cache", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I"]


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sugarloaf*"]
