# The EMA score alone, as a forecast run: views are archived and scored at the end of
# the backtest, the metrics go to the backtest log, nothing is traded. Field reference: ../../docs/EXTERNAL_STRATEGIES.md#manifest-fields
name = "Sugarloaf public EMA forecasts"
root = "../.."
factory = "deployments.quantconnect.config:ema_forecasts"
include = ["examples/ema.py", "examples/ema_research.ipynb", "deployments/quantconnect/config.py"]

[parameters]
ticker = "SPY"
interval_minutes = "5"
